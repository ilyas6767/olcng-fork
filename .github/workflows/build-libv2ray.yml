name: Update Xray-core and build APK

on:
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Версия Xray-core (тег, например v26.7.28)"
        required: true
        default: "v26.7.28"
      build_type:
        description: "Тип сборки APK"
        type: choice
        options:
          - debug
          - release
        default: debug
      commit:
        description: "Закоммитить go.mod/go.sum после успешной сборки"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (с подмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: AndroidLibXrayLite/go.mod
          cache-dependency-path: AndroidLibXrayLite/go.sum

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # build.sh ожидает именно этот NDK: $ANDROID_HOME/ndk/25.2.9519653
      - name: Install NDK 25.2.9519653
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Bump Xray-core
        working-directory: AndroidLibXrayLite
        env:
          XRAY_VERSION: ${{ inputs.xray_version }}
        run: |
          # Теги Xray (v26.x.y) не подходят Go-модулям, поэтому переводим тег в хеш коммита:
          # go сам превратит его в псевдо-версию, как в текущем go.mod.
          SHA=$(git ls-remote https://github.com/XTLS/Xray-core \
            "refs/tags/${XRAY_VERSION}" "refs/tags/${XRAY_VERSION}^{}" | tail -n1 | cut -f1)
          if [ -z "$SHA" ]; then
            echo "Тег ${XRAY_VERSION} не найден в XTLS/Xray-core" >&2
            exit 1
          fi
          echo "Xray-core ${XRAY_VERSION} -> commit ${SHA}"
          go get "github.com/xtls/xray-core@${SHA}"
          go mod tidy
          echo "Xray-core now:"
          go list -m github.com/xtls/xray-core

      # Go 1.27 блокирует linkname из wlynxg/anet на net.zoneCache; без флага линковка падает.
      # Шаг ничего не делает, если флаг уже есть в build.sh.
      - name: Allow anet linkname (-checklinkname=0)
        run: |
          grep -q "checklinkname=0" build.sh || \
            sed -i "s/-ldflags='-s -w -buildid='/-ldflags='-s -w -buildid= -checklinkname=0'/" build.sh
          grep -n "gomobile bind" build.sh

      - name: Build (build.sh)
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          chmod +x build.sh compile-hevtun.sh
          ./build.sh "$BUILD_TYPE"

      # Подпись вашим ключом из секретов (и для debug, и для release), чтобы APK ставился
      # поверх уже установленной версии. Не требует правок build.gradle.kts:
      # подписываем готовые APK через apksigner.
      - name: Sign APKs with release keystore
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "Не задан секрет $v" >&2; exit 1; fi
          done

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"

          mkdir -p signed
          find V2rayNG/app/build/outputs/apk -path "*${BUILD_TYPE}*" -name '*.apk' | while read -r apk; do
            name="$(basename "$apk" | sed 's/-unsigned//')"
            "$BT/zipalign" -f -p 4 "$apk" "signed/$name"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v4-signing-enabled false "signed/$name"
            echo "== $name"
            "$BT/apksigner" verify --print-certs "signed/$name" | grep -i "SHA-256" || true
            # Имя пакета и версия: должны совпадать с установленным приложением (vpn.olcng.fork)
            "$BT/aapt2" dump badging "signed/$name" | grep -E "^package:" | cut -c1-200 || true
          done
          rm -f "$KS"

          ls signed/*.apk > /dev/null   # упадёт, если подписывать было нечего
          ls -lh signed

      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: olcng-${{ inputs.xray_version }}-${{ inputs.build_type }}-signed
          path: signed/*.apk
          if-no-files-found: error

      # Коммит только после успешной сборки, чтобы сломанное обновление не попало в ветку
      - name: Commit go.mod / go.sum
        if: ${{ inputs.commit }}
        env:
          XRAY_VERSION: ${{ inputs.xray_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidLibXrayLite/go.mod AndroidLibXrayLite/go.sum
          git commit -m "Update Xray-core to ${XRAY_VERSION}" || echo "Nothing to commit"
          git push
